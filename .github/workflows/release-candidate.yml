name: Release candidate checks

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/easylife-release-candidate-hardening-*"

permissions:
  contents: read

jobs:
  web:
    name: Web tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-vNext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-vNext/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm test
      - run: npm run test:emulator
      - run: npm run build
      - name: Test publication contract and review server
        run: node --test ../scripts/tests/prepare-pages-publication.test.mjs ../scripts/tests/serve-pages-candidate.test.mjs ../scripts/tests/verify-production-publication.test.mjs
      - name: Stage non-deploying Pages candidate
        run: node ../scripts/prepare-pages-publication.mjs --stage "$RUNNER_TEMP/easylife-pages-candidate" --plan "$RUNNER_TEMP/easylife-pages-root-plan.json"
      - name: Verify staged candidate hashes
        run: node ../scripts/prepare-pages-publication.mjs --verify-stage "$RUNNER_TEMP/easylife-pages-candidate"
      - name: Upload publication review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easylife-pages-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/easylife-pages-candidate
            ${{ runner.temp }}/easylife-pages-root-plan.json
          if-no-files-found: error
          retention-days: 14
      - run: npm audit --omit=dev --audit-level=critical

  functions:
    name: Functions syntax and critical advisory gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=critical
